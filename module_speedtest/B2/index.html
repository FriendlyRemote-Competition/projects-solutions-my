<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 - Voting Results</title>
    <!-- Assuming your bootstrap file is in the same directory -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                    <h3 id="title" class="fw-bold mb-1 text-dark"></h3>
                    <b id="topic" class="text-secondary text-uppercase small"></b>
                </div>

                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                            <span class="badge bg-primary rounded-pill px-4 py-2 fs-6 shadow-sm">
                                Total Votes: <span id="totalVotes">0</span>
                            </span>
                    </div>
                    <div class="row g-3">
                        <div class="col-4">
                            <div class="p-3 border rounded-3 bg-white shadow-sm h-100" id="proContainer">
                                <div class="text-uppercase small fw-bold text-muted mb-2">Pros</div>
                                <div class="fs-5" id="proResult">--</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 border rounded-3 bg-white shadow-sm h-100" id="conContainer">
                                <div class="text-uppercase small fw-bold text-muted mb-2">Cons</div>
                                <div class="fs-5" id="conResult">--</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 border rounded-3 bg-white shadow-sm h-100" id="absContainer">
                                <div class="text-uppercase small fw-bold text-muted mb-2">Abs</div>
                                <div class="fs-5" id="absResult">--</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>
<script defer src="script.js"></script>
</body>
</html>
