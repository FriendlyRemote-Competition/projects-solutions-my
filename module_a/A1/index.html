<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>A1</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        main{
            position: relative;
            width: 365px;
            height: 150px;
        }
        .ring{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid black;
            position: absolute;
        }
        .ring-1{
            border-color:#0085C7;
        }
        .ring-2{
            bottom: 0;
            left: 60px;
            border-color: #F4C300;
        }
        .ring-3{
            top: 0;
            left: 130px;
        }
        .ring-4{
            bottom: 0;
            left: 200px;
            border-color: #009F3D;
        }
        .ring-5{
            top: 0;
            right: 0;
            border-color: #DF0024
        }
    </style>
</head>
<body>
    <main>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>
        <div class="ring ring-5"></div>
    </main>
</body>
</html>
